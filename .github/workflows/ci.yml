# 훅과 테스트를 GitHub에서 다시 돌린다. 실패하면 이슈를 만든다 (docs/RULES.md 3.4절).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install packages
        run: python -m pip install -r env/requirements.txt

      - name: Decide commit range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "range=origin/main..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify
        env:
          VERIFY_RANGE: ${{ steps.range.outputs.range }}
        run: bash verify.sh

      # 브랜치마다 "CI 실패: <브랜치>" 이슈를 하나만 둔다. 이미 열려 있으면 댓글만 단다.
      - name: Open or update issue on failure
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const title = `CI 실패: ${branch}`;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `커밋 ${context.sha.slice(0, 7)}에서 verify.sh가 실패했습니다.\n\n로그: ${url}`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const found = open.find((i) => !i.pull_request && i.title === title);
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: found.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              });
            }

      # 같은 브랜치에서 CI가 다시 통과하면 열린 실패 이슈를 닫는다.
      - name: Close issue on recovery
        if: success() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const title = `CI 실패: ${branch}`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            for (const i of open.filter((i) => !i.pull_request && i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number,
                body: `커밋 ${context.sha.slice(0, 7)}에서 CI가 다시 통과해 닫습니다.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number,
                state: 'closed', state_reason: 'completed',
              });
            }
