# 훅과 테스트를 GitHub에서 다시 돌린다. 실패하면 이슈를 만든다 (docs/RULES.md 3.4절).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff==0.16.6

      - name: Decide commit range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "range=origin/main..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify
        env:
          VERIFY_RANGE: ${{ steps.range.outputs.range }}
        run: bash verify.sh

      - name: Open issue on failure
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.slice(0, 7);
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI 실패: ${context.ref.replace('refs/heads/', '')} ${sha}`,
              body: `push된 커밋 ${sha}에서 verify.sh가 실패했습니다.\n\n로그: ${url}`,
            });
